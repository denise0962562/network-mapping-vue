<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="./src/style.css" rel="stylesheet">
</head>
<body class="flex flex-col min-h-screen bg-gray-200 font-sans">
    
    <div class="flex-grow flex justify-center items-center py-10">

      <!-- 登录页卡片 -->
				
		  <div class="card bg-base-100 card-border border-base-300 w-96 card-lg overflow-hidden">
				<div class="border-base-300 border-b border-dashed">
					<div class="flex items-center gap-2 p-4">
						<div class="grow">
							登录账号
						</div>
					</div>
				</div> 
				<div class="card-body gap-4">
					<div class="flex flex-col gap-1">
						<label class="input validator input-border flex max-w-none items-center gap-2">
							<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="h-4 w-4 opacity-70">
								<path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6ZM12.735 14c.618 0 1.093-.561.872-1.139a6.002 6.002 0 0 0-11.215 0c-.22.578.254 1.139.872 1.139h9.47Z">

								</path>
							</svg> 
							<input 
								type="text" 
								required 
								class="grow" 
								placeholder="用户名"
								minlength="8"
								maxlength="30"
								pattern="[A-Za-z][A-Za-z0-9\-]*"
							>
						</label>
						<p class="validator-hint hidden">
							用户名需要8-30个数字或字母，且只能以字母开头
						</p>
					</div> 
					<div class="flex flex-col gap-1">
						<label class="input validator input-border flex max-w-none items-center gap-2">
							<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="h-4 w-4 opacity-70">
								<path fill-rule="evenodd" d="M14 6a4 4 0 0 1-4.899 3.899l-1.955 1.955a.5.5 0 0 1-.353.146H5v1.5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1-.5-.5v-2.293a.5.5 0 0 1 .146-.353l3.955-3.955A4 4 0 1 1 14 6Zm-4-2a.75.75 0 0 0 0 1.5.5.5 0 0 1 .5.5.75.75 0 0 0 1.5 0 2 2 0 0 0-2-2Z" clip-rule="evenodd">
								</path>
							</svg> 
							<input 
								type="password" 
								required 
								class="grow" 
								placeholder="密码"
								minlength="8"
								maxlength="30"
								pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
							>
						</label> 
						<p class="validator-hint hidden">
							密码需要8位以上，且必须有至少一个大写、小写字母、数字
						</p>
						<!-- <span class="text-base-content/60 flex items-center gap-2 px-1 text-[0.6875rem]">
							<span class="status status-error inline-block">
							</span> 密码需要8位以上，且必须有至少一个大写、小写字母、数字</span> -->
						</div> 
						<div class="card-actions items-center gap-6">
							<button class="btn btn-neutral w-full mt-1">登录</button>
						</div>
					</div>
				</div>

				<!-- 登录页卡片结束 -->

    </div>

    <!-- 页脚开始 -->
    <footer class="footer sm:footer-horizontal footer-center bg-base-content text-base-content p-4 text-white">
    <aside>
        <p>Copyright © 2026 - All right reserved by Abdc.world</p>
    </aside>
    </footer>
    <!-- 页脚结束 -->
    
</body>

</html>
